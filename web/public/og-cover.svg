<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">WeavePress 内容工作流平台</title>
  <desc id="desc">公众号采集、AI 采编、微信排版与多平台发布</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef2ff"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#312e81" flood-opacity=".16"/></filter></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><circle cx="1030" cy="40" r="250" fill="#c4b5fd" opacity=".24"/><circle cx="120" cy="630" r="270" fill="#a5b4fc" opacity=".18"/>
