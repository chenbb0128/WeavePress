services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-weavepress}
      MYSQL_USER: ${MYSQL_USER:-weavepress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-weavepress_pass}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["mysql_data:/var/lib/mysql"]

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["redis_data:/data"]

  migrate:
    build: { context: ../server, dockerfile: deployments/Dockerfile, args: { TARGET: migrate } }
    command: ["-command", "up"]
    environment: &server-env
      WEAVEPRESS_APP_ENV: ${WEAVEPRESS_APP_ENV:-local}
      WEAVEPRESS_DATABASE_ENABLED: "true"
      WEAVEPRESS_DATABASE_DSN: ${MYSQL_USER:-weavepress}:${MYSQL_PASSWORD:-weavepress_pass}@tcp(mysql:3306)/${MYSQL_DATABASE:-weavepress}
      WEAVEPRESS_REDIS_ENABLED: "true"
      WEAVEPRESS_REDIS_ADDR: redis:6379
      WEAVEPRESS_REDIS_KEY_PREFIX: weavepress:compose
      WEAVEPRESS_AUTH_JWT_SECRET: ${WEAVEPRESS_AUTH_JWT_SECRET:-local-development-jwt-secret-change-me}
      WEAVEPRESS_AUTH_MEDIA_SIGNING_KEY: ${WEAVEPRESS_AUTH_MEDIA_SIGNING_KEY:-local-development-media-signing-key}
      WEAVEPRESS_AUTH_COOKIE_SECURE: ${WEAVEPRESS_AUTH_COOKIE_SECURE:-false}
      WEAVEPRESS_STORAGE_DRIVER: ${WEAVEPRESS_STORAGE_DRIVER:-local}
      WEAVEPRESS_STORAGE_LOCAL_DIR: /app/data
      WEAVEPRESS_STORAGE_QINIU_ACCESS_KEY: ${WEAVEPRESS_STORAGE_QINIU_ACCESS_KEY:-}
      WEAVEPRESS_STORAGE_QINIU_SECRET_KEY: ${WEAVEPRESS_STORAGE_QINIU_SECRET_KEY:-}
      WEAVEPRESS_STORAGE_QINIU_BUCKET: ${WEAVEPRESS_STORAGE_QINIU_BUCKET:-}
      WEAVEPRESS_STORAGE_QINIU_DOMAIN: ${WEAVEPRESS_STORAGE_QINIU_DOMAIN:-}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ../server, dockerfile: deployments/Dockerfile, args: { TARGET: api } }
    environment:
      <<: *server-env
      WEAVEPRESS_HTTP_ADDR: :8080
      WEAVEPRESS_HTTP_TRUSTED_PROXIES: 172.16.0.0/12
      WEAVEPRESS_WECHAT_ENABLED: ${WEAVEPRESS_WECHAT_ENABLED:-false}
      WEAVEPRESS_WECHAT_APP_ID: ${WEAVEPRESS_WECHAT_APP_ID:-}
      WEAVEPRESS_WECHAT_APP_SECRET: ${WEAVEPRESS_WECHAT_APP_SECRET:-}
      WEAVEPRESS_WECHAT_API_BASE: ${WEAVEPRESS_WECHAT_API_BASE:-https://api.weixin.qq.com}
      WEAVEPRESS_WECHAT_REQUEST_TIMEOUT: ${WEAVEPRESS_WECHAT_REQUEST_TIMEOUT:-30s}
    ports: ["8080:8080"]
    volumes: ["media_data:/app/data"]
    healthcheck:
      test: ["CMD", "/app/healthcheck", "-url", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ../server, dockerfile: deployments/Dockerfile, args: { TARGET: worker } }
    environment:
      <<: *server-env
      WEAVEPRESS_WORKER_ENABLED: "true"
      WEAVEPRESS_WORKER_CONCURRENCY: "4"
      WEAVEPRESS_WECHAT_ENABLED: ${WEAVEPRESS_WECHAT_ENABLED:-false}
      WEAVEPRESS_WECHAT_APP_ID: ${WEAVEPRESS_WECHAT_APP_ID:-}
      WEAVEPRESS_WECHAT_APP_SECRET: ${WEAVEPRESS_WECHAT_APP_SECRET:-}
      WEAVEPRESS_WECHAT_API_BASE: ${WEAVEPRESS_WECHAT_API_BASE:-https://api.weixin.qq.com}
      WEAVEPRESS_WECHAT_REQUEST_TIMEOUT: ${WEAVEPRESS_WECHAT_REQUEST_TIMEOUT:-30s}
    volumes: ["media_data:/app/data"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  gateway:
    build: { context: .., dockerfile: deploy/Dockerfile.gateway }
    ports: ["80:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  mysql_data:
  redis_data:
  media_data:
