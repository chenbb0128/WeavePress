openapi: 3.0.3
info:
  title: WeavePress API
  version: 0.2.0
  description: 内部内容采集、微信稿件审核、公众号草稿箱发布和用户管理 API。
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: 存活检查
      responses: { "200": { description: OK } }
  /ready:
    get:
      summary: 依赖就绪检查
      responses: { "200": { description: Ready }, "503": { $ref: "#/components/responses/Error" } }
  /api/auth/login:
    post:
      summary: 登录
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginInput" } } }
      responses: { "200": { description: 登录成功, content: { application/json: { schema: { $ref: "#/components/schemas/TokenEnvelope" } } } }, "401": { $ref: "#/components/responses/Error" } }
  /api/auth/refresh:
    post:
      summary: 轮换 Refresh Token
      responses: { "200": { description: 刷新成功, content: { application/json: { schema: { $ref: "#/components/schemas/TokenEnvelope" } } } }, "401": { $ref: "#/components/responses/Error" } }
  /api/auth/logout:
    post:
      summary: 退出并撤销 Refresh Token
      responses: { "200": { description: 已退出 } }
  /api/user/info:
    get:
      summary: 当前用户
      security: [ { bearerAuth: [] } ]
      responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Error" } }
  /api/auth/codes:
    get:
      summary: 当前权限码
      security: [ { bearerAuth: [] } ]
      responses: { "200": { description: OK } }
  /api/menu/all:
    get:
      summary: 后端菜单兼容接口
      security: [ { bearerAuth: [] } ]
      responses: { "200": { description: OK } }
  /api/dashboard:
    get:
      summary: 工作台统计
      security: [ { bearerAuth: [] } ]
      responses: { "200": { description: OK } }
  /api/users:
    get:
      summary: 用户列表
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }, { name: keyword, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string, enum: [active, disabled] } } ]
      responses: { "200": { description: OK }, "403": { $ref: "#/components/responses/Error" } }
    post:
      summary: 创建用户
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateUserInput" } } }
      responses: { "201": { description: Created }, "403": { $ref: "#/components/responses/Error" } }
  /api/users/{id}:
    parameters: [ { $ref: "#/components/parameters/ID" } ]
    patch:
      summary: 修改用户
      security: [ { bearerAuth: [] } ]
      responses: { "200": { description: OK } }
    put:
      summary: 修改用户（管理后台兼容）
      security: [ { bearerAuth: [] } ]
      responses: { "200": { description: OK } }
  /api/users/{id}/password:
    parameters: [ { $ref: "#/components/parameters/ID" } ]
    put:
      summary: 重置密码并撤销登录会话
      security: [ { bearerAuth: [] } ]
      responses: { "200": { description: OK } }
  /api/collection-jobs:
    get:
      summary: 采集任务列表
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }, { name: status, in: query, schema: { type: string } } ]
      responses: { "200": { description: OK } }
    post:
      summary: 提交文章链接
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } } } }
      responses: { "202": { description: 已进入队列 }, "400": { $ref: "#/components/responses/Error" } }
  /api/collection-jobs/{id}:
    get:
      summary: 任务详情和事件
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/Error" } }
  /api/collection-jobs/{id}/retry:
    post:
      summary: 手动重试失败任务
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      responses: { "200": { description: 已重新排队 }, "409": { $ref: "#/components/responses/Error" } }
  /api/articles:
    get:
      summary: 文章列表
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }, { name: keyword, in: query, schema: { type: string } }, { name: sourceType, in: query, schema: { type: string, enum: [wechat, web] } }, { name: status, in: query, schema: { type: string, enum: [pending, processing, ready, failed] } } ]
      responses: { "200": { description: OK } }
  /api/articles/{id}:
    get:
      summary: 文章结构化详情
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/Error" } }
  /api/articles/{id}/raw-url:
    get:
      summary: 原始快照短期签名地址
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      responses: { "200": { description: OK } }
  /api/drafts:
    get:
      summary: 微信稿件列表
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }, { name: keyword, in: query, schema: { type: string } }, { name: status, in: query, schema: { $ref: "#/components/schemas/DraftStatus" } } ]
      responses: { "200": { description: OK } }
    post:
      summary: 从采集文章创建微信稿件
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [articleId], properties: { articleId: { type: integer, format: int64, minimum: 1 } } } } }
      responses: { "201": { description: Created }, "409": { $ref: "#/components/responses/Error" } }
  /api/drafts/{id}:
    parameters: [ { $ref: "#/components/parameters/ID" } ]
    get:
      summary: 稿件详情、来源素材、预览和流程审计
      security: [ { bearerAuth: [] } ]
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/Error" } }
    put:
      summary: 使用乐观锁保存稿件并创建新版本
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateDraftInput" } } }
      responses: { "200": { description: OK }, "409": { $ref: "#/components/responses/Error" } }
  /api/drafts/{id}/versions:
    get:
      summary: 稿件版本列表
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      responses: { "200": { description: OK } }
  /api/drafts/{id}/versions/{version}/restore:
    post:
      summary: 将历史版本复制为新的当前版本
      description: 仅编辑中的稿件可恢复；旧版本保持不可变，并使用 expectedVersion 乐观锁防止覆盖他人修改。
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RestoreDraftVersionInput" } } }
      responses: { "200": { description: 已生成新的当前版本 }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /api/drafts/{id}/preflight:
    get:
      summary: 检查稿件是否符合微信公众号草稿规则
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      responses:
        "200":
          description: 检查结果
          content: { application/json: { schema: { type: object, required: [code, message, data], properties: { code: { type: integer }, message: { type: string }, data: { $ref: "#/components/schemas/PreflightResult" } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/drafts/{id}/submit-review:
    post:
      summary: 提交稿件审核
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      responses: { "200": { description: OK }, "409": { $ref: "#/components/responses/Error" } }
  /api/drafts/{id}/review:
    post:
      summary: 管理员审核通过或退回稿件
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [approved], properties: { approved: { type: boolean }, note: { type: string, maxLength: 200 } } } } }
      responses: { "200": { description: OK }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /api/drafts/{id}/publish:
    post:
      summary: 管理员创建微信公众号草稿箱发布任务
      description: 只写入微信公众号草稿箱，不自动群发。
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      responses: { "202": { description: 已进入队列 }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } }
  /api/wechat/status:
    get:
      summary: 微信公众号发布配置状态
      security: [ { bearerAuth: [] } ]
      responses: { "200": { description: OK } }
  /api/wechat-publish-jobs:
    get:
      summary: 微信草稿箱发布任务列表
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }, { name: status, in: query, schema: { $ref: "#/components/schemas/PublishJobStatus" } } ]
      responses: { "200": { description: OK } }
  /api/wechat-publish-jobs/{id}:
    get:
      summary: 微信发布任务详情和事件
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/Error" } }
  /api/wechat-publish-jobs/{id}/retry:
    post:
      summary: 管理员重试失败的微信发布任务
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      responses: { "202": { description: 已重新排队 }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /api/ai/status:
    get:
      summary: AI 采编配置状态
      operationId: getAIStatus
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: AI 配置状态
          content: { application/json: { schema: { $ref: "#/components/schemas/AIStatusEnvelope" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/articles/{id}/ai-analyses:
    parameters: [ { $ref: "#/components/parameters/ID" } ]
    post:
      summary: 为来源文章创建 AI 分析任务
      operationId: startAIAnalysis
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StartAIAnalysisInput" } } }
      responses:
        "202":
          description: 分析任务已进入队列或复用已有任务
          content: { application/json: { schema: { $ref: "#/components/schemas/StartAIAnalysisEnvelope" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    get:
      summary: 来源文章的 AI 分析列表
      operationId: listAIAnalyses
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" } ]
      responses:
        "200":
          description: AI 分析分页列表
          content: { application/json: { schema: { $ref: "#/components/schemas/AIAnalysisPageEnvelope" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/ai-analyses/{id}:
    get:
      summary: AI 分析详情
      operationId: getAIAnalysis
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      responses:
        "200":
          description: AI 分析详情
          content: { application/json: { schema: { $ref: "#/components/schemas/AIAnalysisEnvelope" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/ai-analyses/{id}/generations:
    post:
      summary: 基于 AI 分析创建采编稿件生成任务
      operationId: startAIGeneration
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GenerationInput" } } }
      responses:
        "202":
          description: 生成任务已进入队列或复用已有任务
          content: { application/json: { schema: { $ref: "#/components/schemas/StartAIGenerationEnvelope" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/ai-generations/{id}:
    get:
      summary: AI 生成结果详情
      operationId: getAIGeneration
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      responses:
        "200":
          description: AI 生成结果详情
          content: { application/json: { schema: { $ref: "#/components/schemas/AIGenerationEnvelope" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/ai-jobs:
    get:
      summary: AI 任务列表
      operationId: listAIJobs
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/AIJobType" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AIJobStatus" } }
        - { name: articleId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: AI 任务分页列表
          content: { application/json: { schema: { $ref: "#/components/schemas/AIJobPageEnvelope" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/ai-jobs/{id}:
    get:
      summary: AI 任务详情（含来源文章和状态事件）
      operationId: getAIJob
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      responses:
        "200":
          description: AI 任务详情
          content: { application/json: { schema: { $ref: "#/components/schemas/AIJobEnvelope" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/ai-jobs/{id}/retry:
    post:
      summary: 手动重试失败的 AI 任务
      operationId: retryAIJob
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/ID" } ]
      responses:
        "202":
          description: AI 任务已重新排队
          content: { application/json: { schema: { $ref: "#/components/schemas/AIJobEnvelope" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /media/assets/{id}:
    get:
      summary: 签名素材访问
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: expires, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 本地文件 }, "307": { description: 重定向到七牛私有下载地址 }, "403": { description: 签名无效或过期 } }
  /media/raw/{id}:
    get:
      summary: 签名原始快照下载
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: expires, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 本地 gzip 快照 }, "307": { description: 重定向到七牛私有下载地址 }, "403": { description: 签名无效或过期 } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  schemas:
    LoginInput:
      type: object
      required: [username, password]
      properties: { username: { type: string, minLength: 3 }, password: { type: string, minLength: 8 } }
    CreateUserInput:
      type: object
      required: [username, password, realName, role]
      properties: { username: { type: string }, password: { type: string, minLength: 8 }, realName: { type: string }, role: { type: string, enum: [admin, editor] } }
    DraftStatus:
      type: string
      enum: [editing, in_review, approved, publishing, published, publish_failed]
    PublishJobStatus:
      type: string
      enum: [queued, publishing, completed, failed]
    UpdateDraftInput:
      type: object
      required: [title, contentHtml, expectedVersion]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        author: { type: string, maxLength: 64 }
        digest: { type: string, maxLength: 255 }
        contentHtml: { type: string, minLength: 1 }
        coverAssetId: { type: integer, format: int64, minimum: 1, nullable: true }
        expectedVersion: { type: integer, minimum: 1 }
        changeNote: { type: string, maxLength: 255 }
    RestoreDraftVersionInput:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    PreflightResult:
      type: object
      required: [valid, issues]
      properties:
        valid: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string, example: WECHAT_TITLE_TOO_LONG }
              message: { type: string }
              field: { type: string }
    AIJobStatus:
      type: string
      enum: [queued, running, completed, failed]
    AIJobType:
      type: string
      enum: [analysis, generation]
    TokenUsage:
      type: object
      required: [inputTokens, outputTokens, totalTokens]
      properties:
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
        totalTokens: { type: integer, minimum: 0 }
    AIStatus:
      type: object
      required: [enabled, provider, model]
      properties:
        enabled: { type: boolean }
        provider: { type: string, example: openai-compatible }
        model: { type: string }
    StartAIAnalysisInput:
      type: object
      additionalProperties: false
      properties:
        force: { type: boolean, default: false }
    GenerationInput:
      type: object
      additionalProperties: false
      required: [angleId, audience, tone, targetWords, idempotencyKey]
      properties:
        angleId: { type: string, minLength: 1, pattern: '.*\S.*' }
        audience: { type: string, minLength: 1, maxLength: 100, pattern: '.*\S.*' }
        tone: { type: string, enum: [professional, plain, analytical, storytelling, warm] }
        targetWords: { type: integer, minimum: 300, maximum: 5000 }
        additionalInstructions: { type: string, maxLength: 500, default: "" }
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[\u0000-\u007F]{8,128}$'
          description: 8 到 128 个 ASCII 字符。
    AIFact:
      type: object
      required: [id, text, sourceBlockIds, confidence]
      properties:
        id: { type: string }
        text: { type: string }
        sourceBlockIds: { type: array, items: { type: string } }
        confidence: { type: string, enum: [high, medium, low] }
    AIViewpoint:
      type: object
      required: [id, text, holder, sourceBlockIds]
      properties:
        id: { type: string }
        text: { type: string }
        holder: { type: string }
        sourceBlockIds: { type: array, items: { type: string } }
    AIQuote:
      type: object
      required: [id, text, sourceBlockId]
      properties:
        id: { type: string }
        text: { type: string }
        sourceBlockId: { type: string }
    AIRisk:
      type: object
      required: [id, text, sourceBlockIds]
      properties:
        id: { type: string }
        text: { type: string }
        sourceBlockIds: { type: array, items: { type: string } }
    AIAngle:
      type: object
      required: [id, title, thesis, outline]
      properties:
        id: { type: string }
        title: { type: string }
        thesis: { type: string }
        outline: { type: array, items: { type: string } }
    AIJobArticle:
      type: object
      description: AI 任务关联的来源文章；存储键、哈希等内部字段不会返回。
      required: [id, title, sourceType, status, createdBy, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        originalUrl: { type: string }
        canonicalUrl: { type: string }
        sourceType: { type: string }
        title: { type: string }
        author: { type: string }
        sourceName: { type: string }
        language: { type: string }
        publishedAt: { type: string, format: date-time, nullable: true }
        plainText: { type: string }
        cleanHtml: { type: string }
        status: { type: string }
        duplicateOfId: { type: integer, format: int64, minimum: 1, nullable: true }
        createdBy: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AIJobEvent:
      type: object
      required: [id, jobId, status, message, createdAt]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        jobId: { type: integer, format: int64, minimum: 1 }
        status: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    AIJob:
      allOf:
        - { $ref: "#/components/schemas/TokenUsage" }
        - type: object
          required: [id, type, articleId, requestedBy, status, attempts, manualRetries, provider, model, promptVersion, retryable, createdAt, updatedAt]
          properties:
            id: { type: integer, format: int64, minimum: 1 }
            type: { $ref: "#/components/schemas/AIJobType" }
            articleId: { type: integer, format: int64, minimum: 1 }
            parentJobId: { type: integer, format: int64, minimum: 1, nullable: true }
            requestedBy: { type: integer, format: int64, minimum: 1 }
            status: { $ref: "#/components/schemas/AIJobStatus" }
            attempts: { type: integer, minimum: 0 }
            manualRetries: { type: integer, minimum: 0 }
            provider: { type: string }
            model: { type: string }
            promptVersion: { type: string }
            errorCode: { type: string }
            errorMessage: { type: string }
            retryable: { type: boolean }
            startedAt: { type: string, format: date-time, nullable: true }
            finishedAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            article: { $ref: "#/components/schemas/AIJobArticle" }
            events:
              type: array
              items: { $ref: "#/components/schemas/AIJobEvent" }
    AIAnalysis:
      type: object
      required: [id, jobId, articleId, summary, facts, viewpoints, quotes, risks, angles, createdAt]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        jobId: { type: integer, format: int64, minimum: 1 }
        articleId: { type: integer, format: int64, minimum: 1 }
        summary: { type: string }
        facts: { type: array, items: { $ref: "#/components/schemas/AIFact" } }
        viewpoints: { type: array, items: { $ref: "#/components/schemas/AIViewpoint" } }
        quotes: { type: array, items: { $ref: "#/components/schemas/AIQuote" } }
        risks: { type: array, items: { $ref: "#/components/schemas/AIRisk" } }
        angles: { type: array, minItems: 3, maxItems: 3, items: { $ref: "#/components/schemas/AIAngle" } }
        createdAt: { type: string, format: date-time }
        job: { $ref: "#/components/schemas/AIJob" }
    AIGeneratedBlock:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [heading, paragraph, quote, list, image] }
        level: { type: integer, minimum: 2, maximum: 4 }
        text: { type: string }
        items: { type: array, items: { type: string } }
        factIds: { type: array, items: { type: string } }
        quoteId: { type: string }
        assetId: { type: integer, format: int64, minimum: 1 }
        alt: { type: string }
    AIGeneration:
      type: object
      required: [id, jobId, analysisId, angleId, audience, tone, targetWords, additionalInstructions, title, digest, blocks, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        jobId: { type: integer, format: int64, minimum: 1 }
        analysisId: { type: integer, format: int64, minimum: 1 }
        angleId: { type: string }
        audience: { type: string, minLength: 1, maxLength: 100 }
        tone: { type: string, enum: [professional, plain, analytical, storytelling, warm] }
        targetWords: { type: integer, minimum: 300, maximum: 5000 }
        additionalInstructions: { type: string, maxLength: 500 }
        title: { type: string }
        digest: { type: string }
        blocks:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/AIGeneratedBlock" }
        factMap:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        contentHtml: { type: string }
        draftId: { type: integer, format: int64, minimum: 1, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        job: { $ref: "#/components/schemas/AIJob" }
    AIAnalysisPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AIAnalysis" } }
        total: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    AIJobPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AIJob" } }
        total: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    StartAIAnalysisResult:
      type: object
      required: [job, reused]
      properties:
        job: { $ref: "#/components/schemas/AIJob" }
        reused: { type: boolean }
    StartAIGenerationResult:
      type: object
      required: [generation, job, reused]
      properties:
        generation: { $ref: "#/components/schemas/AIGeneration" }
        job: { $ref: "#/components/schemas/AIJob" }
        reused: { type: boolean }
    AIStatusEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        data: { $ref: "#/components/schemas/AIStatus" }
    StartAIAnalysisEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        data: { $ref: "#/components/schemas/StartAIAnalysisResult" }
    StartAIGenerationEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        data: { $ref: "#/components/schemas/StartAIGenerationResult" }
    AIAnalysisEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        data: { $ref: "#/components/schemas/AIAnalysis" }
    AIGenerationEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        data: { $ref: "#/components/schemas/AIGeneration" }
    AIJobEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        data: { $ref: "#/components/schemas/AIJob" }
    AIAnalysisPageEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        data: { $ref: "#/components/schemas/AIAnalysisPage" }
    AIJobPageEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        data: { $ref: "#/components/schemas/AIJobPage" }
    TokenEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        data:
          type: object
          required: [accessToken, expiresIn]
          properties: { accessToken: { type: string }, expiresIn: { type: integer, example: 900 } }
    Error:
      type: object
      required: [code, message]
      properties: { code: { type: integer }, message: { type: string }, details: { type: array, items: { type: object } } }
  responses:
    Error:
      description: 业务错误
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
