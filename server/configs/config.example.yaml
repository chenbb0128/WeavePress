app:
  name: weavepress
  env: local

http:
  addr: ":8080"
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s
  max_header_bytes: 1048576
  max_body_bytes: 1048576
  trusted_proxies: []
  cors:
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
    allowed_methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed_headers:
      - Authorization
      - Content-Type
      - X-Request-ID
      - traceparent
      - tracestate
    allow_credentials: true

database:
  enabled: true
  driver: mysql
  dsn: "weavepress:weavepress_pass@tcp(127.0.0.1:3306)/weavepress"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
  ping_timeout: 3s

redis:
  enabled: true
  addr: "127.0.0.1:6379"
  username: ""
  password: ""
  db: 0
  dial_timeout: 3s
  read_timeout: 2s
  write_timeout: 2s
  ping_timeout: 2s
  pool_size: 10
  min_idle_conns: 2
  key_prefix: "weavepress:local"

worker:
  enabled: false
  concurrency: 4
  shutdown_timeout: 10s
  queues:
    collection: 2
    publishing: 1
    default: 1

auth:
  jwt_secret: "local-development-jwt-secret-change-me"
  access_ttl: 15m
  refresh_ttl: 720h
  refresh_cookie: wp_refresh_token
  cookie_secure: false
  media_signing_key: "local-development-media-signing-key"
  media_url_ttl: 10m

storage:
  driver: local # production must use qiniu
  local_dir: ./data
  qiniu:
    access_key: ""
    secret_key: ""
    bucket: ""
    domain: ""

collector:
  page_max_bytes: 10485760
  image_max_bytes: 15728640
  article_max_bytes: 104857600
  max_images: 100
  request_timeout: 30s
  image_timeout: 30s
  image_concurrency: 4
  max_redirects: 5
  user_agent: "Mozilla/5.0 (compatible; WeavePress/1.0)"

wechat:
  enabled: false
  app_id: ""
  app_secret: ""
  api_base: "https://api.weixin.qq.com"
  request_timeout: 30s

observability:
  metrics:
    enabled: true
    path: /metrics
    namespace: weavepress
  tracing:
    enabled: false
    exporter: stdout # stdout or otlp
    endpoint: localhost:4317
    insecure: true
    sample_ratio: 1.0

log:
  level: info
