version: "2"
sql:
  - engine: mysql
    schema: database/migrations
    queries: database/queries
    gen:
      go:
        package: sqlc
        out: internal/platform/database/sqlc
        sql_package: database/sql
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false